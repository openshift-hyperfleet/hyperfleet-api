# In-server drift loop: polls clusters and runs their adapter chains.
orchestrator:
  enabled: true
  poll_interval: 5s

# Coreshift adapter: mints local podman control planes.
# The pull-secret path comes from HYPERFLEET_CORESHIFT_PULL_SECRET_FILE.
coreshift:
  binary: coreshift

# Etcd adapter: places members across the local kind fleet.
etcd:
  fleet_dir: .fleet
  preferred_mc: mc-0

# HCP adapter: nested coreshift control plane on a management cluster.
hcp:
  image: localhost/coreshift:latest

server:
  jwt:
    enabled: true
    configs:
      - issuer_url: https://test-issuer.example.com
        jwk_cert_file: configs/dev-jwks.json
        header: Authorization
        identity_claim: email
  tenant:
    enabled: true
    # Dev runs with JWT (make run), so exercise the claims path like edge+api
    # deployments; gen-dev-token.sh signs the matching claims.
    claims_enabled: true
    system_header: x-hyperfleet-system
    dimensions:
      - header: x-tenant-org
        claim: org_id
        key: org
        required: true
      - header: x-tenant-project
        claim: project_id
        key: project
        required: false

entities:
  - kind: Cluster
    plural: clusters
    spec_schema_name: ClusterSpec
    required_adapters: [coreshift, etcd, hcp]
    name_min_len: 3
    name_max_len: 53
    require_spec_schema: true

  - kind: NodePool
    plural: nodepools
    parent_kind: Cluster
    on_parent_delete: cascade
    spec_schema_name: NodePoolSpec
    required_adapters: [validation, hypershift]
    name_min_len: 3
    name_max_len: 15
    require_spec_schema: true

  - kind: Channel
    plural: channels
    spec_schema_name: ChannelSpec

  - kind: Version
    plural: versions
    parent_kind: Channel
    on_parent_delete: restrict
    spec_schema_name: VersionSpec

  - kind: WifConfig
    plural: wifconfigs
    spec_schema_name: WifConfigSpec

# Adapter chains keyed by topology/platform.
chains:
  - topology: hosted
    platform: coreshift
    adapters: [coreshift]
  - topology: hosted
    platform: etcd
    adapters: [etcd]
  - topology: hosted
    platform: hcp
    adapters: [etcd, hcp]
